spring.application.name=AlgoMentor

# Database Configuration (H2 in-memory database)
spring.datasource.url=jdbc:h2:mem:algomentor
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm}
jwt.expiration=18000000

# Rate Limiting
rate.limit.enabled=true
rate.limit.requests=100
rate.limit.duration=60000
